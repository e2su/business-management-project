name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: salesdw
          POSTGRES_PASSWORD: salesdw
          POSTGRES_DB: sales_dw_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U salesdw" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://salesdw:salesdw@localhost:5432/sales_dw_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
